access_token: <token>
homeserver_url: <hs_url>
rooms:
  - '<room_id>'
pl_overrides:
  '<user_id>': 100
target_room_version: 12
state_events_to_transfer:
  - "m.room.avatar"
  - "m.room.encryption"
  - "m.room.guest_access"
  - "m.room.history_visibility"
  - "m.room.join_rules"
  - "m.room.name"
  - "m.room.server_acl"
  - "m.room.topic"
drop_members:
  - '<user_id>'
