access_token: <token>
homeserver_url: <hs_url>
rooms:
  - '<room_id>'
pl_overrides:
  '<user_id>': 100
target_room_version: 12
state_events_to_transfer:
  - "m.room.avatar"
  - "m.room.encryption"
  - "m.room.guest_access"
  - "m.room.history_visibility"
  - "m.room.join_rules"
  - "m.room.name"
  - "m.room.server_acl"
  - "m.room.topic"
drop_members:
  - '<user_id>'
# Whether to ban users banned in the old room in the new one too, defaults to true.
transfer_bans: true
# Users whose bans aren't transferred, like moderation bots that ban users themselves.
skip_bans_by:
  - '<user_id>'
